services:
  - type: web
    name: cinerec-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "src.webapp.backend.app:create_app()" --bind "0.0.0.0:$PORT" --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
