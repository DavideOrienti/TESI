dataset: small  # default; override via load_settings(dataset=...) o env CINEREC_DATASET

datasets:
  small:
    raw: data/raw/ml-latest-small
    processed: data/processed/small
  ml-20m:
    raw: data/raw/ml-20m
    processed: data/processed/20m  # riusa il lavoro Fase_0/Fase_1 esistente su ml-20m
  ml-25m-1m:
    raw: data/raw/ml-25m-1m
    processed: data/processed/ml-25m-1m

paths:
  cache_tmdb: cache/tmdb

tmdb:
  api_key_env: TMDB_API_KEY
  sleep_sec: 0.25
  timeout_sec: 10
  max_retries: 3
  backoff_sec: 1.0

filters:
  min_user_ratings: 8
  min_item_ratings: 8
  iterative_filtering: true

movies:
  clean_year_regex: "\\((\\d{4})\\)$"